# XcodeGen specification.
#
# The Xcode project is generated on the CI runner from this file, so no
# .xcodeproj is kept in the repository. Generate it with:
#
#   xcodegen generate --spec project.yml
#
# A UI test bundle needs a host application, even when every test drives a
# system app by bundle identifier. SimShotHost exists only to satisfy that.

name: SimShot

options:
  bundleIdPrefix: com.example.simshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:

  SimShotHost:
    type: application
    platform: iOS
    sources:
      - path: SimShotHost
    info:
      path: SimShotHost/Info.plist
      properties:
        CFBundleDisplayName: SimShot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.simshot.host

  SimShotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SimShotUITests
    info:
      path: SimShotUITests/Info.plist
    dependencies:
      - target: SimShotHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.simshot.uitests

schemes:
  SimShot:
    build:
      targets:
        SimShotHost: all
        SimShotUITests: [test]
    test:
      targets:
        - SimShotUITests
      gatherCoverageData: false
