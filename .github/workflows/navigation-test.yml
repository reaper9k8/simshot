name: Simulator navigation test

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.yml'
      - 'SimShotHost/**'
      - 'SimShotUITests/**'
      - 'tools/**'
      - 'make-sim.sh'
      - 'extract-screenshots.sh'
      - '.github/workflows/navigation-test.yml'

permissions:
  contents: read

jobs:
  navigate:
    name: Drive the Simulator and capture named screens
    # xcode-27 is the STANDARD GitHub-hosted runner.
    # Do not change this to xcode-27-xlarge: larger runners are billed and are
    # not covered by the free allowance for public repositories.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      DEVICE: "iPhone 18 Pro"
      RUNTIME: "iOS 27.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report what this runner has
        run: |
          # The round 3 run silently used a stale copy of this file, because
          # the .github folder had not been uploaded with the rest. The whole
          # AppCaptureTests suite never executed and nothing said so. This
          # marker makes the version obvious in the log and in the summary.
          echo "WORKFLOW_VERSION=round-4"
          echo "macOS:";  sw_vers
          echo "Xcode:";  xcodebuild -version
          echo "Python:"; python3 --version

      - name: Confirm both test suites exist in this checkout
        run: |
          for suite in FigureCaptureTests AppCaptureTests; do
            test -f "SimShotUITests/$suite.swift" \
              || { echo "FAIL: SimShotUITests/$suite.swift is missing from the checkout"; exit 1; }
            echo "found SimShotUITests/$suite.swift"
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project SimShot.xcodeproj

      - name: Create and boot the simulator
        id: sim
        run: |
          chmod +x make-sim.sh
          UDID=$(./make-sim.sh "$DEVICE" "$RUNTIME" simshot-nav)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Booted $UDID"

      - name: Give the simulator a clean status bar
        run: |
          mkdir -p out
          UDID="${{ steps.sim.outputs.udid }}"
          # A neutral, repeatable status bar: a fixed clock, full signal and a
          # charged battery, and no carrier name. Without this the clock is
          # whatever time the runner booted at and there is no signal at all,
          # so two runs are never comparable.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 \
            || echo "NOTE: status_bar override was rejected. Continuing."
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl ui "$UDID" content_size large || true
          sleep 3
          xcrun simctl io "$UDID" screenshot out/status-bar-check.png
          sips -g pixelWidth -g pixelHeight out/status-bar-check.png

      - name: Build the test bundle
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SimShot.xcodeproj \
            -scheme SimShot \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee out/build.log | tail -40

      # ---------------- Only what is still missing ----------------
      #
      # VariantCaptureTests and GestureProbeTests are deliberately NOT run.
      # Their output is already captured, verified by eye and filed under
      # figures/simulator. Re-running them would burn runner time to produce
      # files we already have.

      - name: Capture the missing Settings figures
        run: |
          set +e
          xcodebuild test-without-building \
            -project SimShot.xcodeproj -scheme SimShot \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath out/main.xcresult \
            -only-testing:SimShotUITests/FigureCaptureTests \
            CODE_SIGNING_ALLOWED=NO \
            > out/main.log 2>&1
          STATUS=$?
          set -e
          echo "xcodebuild exit code: $STATUS"
          grep -E "^(CAPTURE|MISSED|CLAIM|SWITCH|SCROLL|ALERTS)" out/main.log || true

      # ---------------- App screens ----------------

      - name: Capture the app figures
        run: |
          set +e
          xcodebuild test-without-building \
            -project SimShot.xcodeproj -scheme SimShot \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath out/apps.xcresult \
            -only-testing:SimShotUITests/AppCaptureTests \
            CODE_SIGNING_ALLOWED=NO \
            > out/apps.log 2>&1
          STATUS=$?
          set -e
          echo "xcodebuild exit code: $STATUS"
          grep -E "^(CAPTURE|MISSED|ALERTS)" out/apps.log || true

      # ---------------- pull the images out ----------------

      - name: Extract the screenshots
        if: always()
        run: |
          chmod +x extract-screenshots.sh
          for pass in main apps; do
            if [ -d "out/$pass.xcresult" ]; then
              echo "########## $pass ##########"
              ./extract-screenshots.sh "out/$pass.xcresult" "out/screenshots/$pass" || true
            else
              echo "no result bundle for $pass"
            fi
          done

      - name: Summarize what the tests reported
        if: always()
        run: |
          # `grep .` at the end of each pipeline fails on empty input, which is
          # what makes the "none" fallback fire instead of leaving a blank.
          {
            echo "# What the run reported"
            echo
            echo "Workflow version: round-4"
            echo
            echo "## Captures"
            grep -h "^CAPTURE" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Screens that could not be reached"
            grep -h "^MISSED" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Switches"
            grep -h "^SWITCH" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Interface label checks"
            grep -h "^CLAIM" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Row inventories"
            grep -h "^INVENTORY" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Scrolling"
            grep -h "^SCROLL" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Alerts dismissed"
            grep -h "^ALERTS" out/*.log 2>/dev/null | sort -u | grep . || echo "none"
            echo
            echo "## Test failures reported by xcodebuild"
            grep -hE "error:|Failing tests:|\*\* TEST" out/*.log 2>/dev/null | sort -u | head -40 | grep . || echo "none"
          } | tee out/run-summary.txt
          cat out/run-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Shut the simulator down
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete   "$UDID" || true

      - name: Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-output
          path: |
            out/screenshots/**
            out/run-summary.txt
            out/status-bar-check.png
            out/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the raw result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-xcresult
          path: out/*.xcresult
          if-no-files-found: warn
          retention-days: 7
